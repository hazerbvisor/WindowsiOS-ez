name: Publish MetalGPU driver installer R2
on:
  push:
    branches: [build/metalgpu-driver-release]
    paths: [.github/workflows/publish-metalgpu-driver.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify upstream driver archive and installer
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          curl --fail --location --retry 3 --output "$work/driver.zip" https://github.com/utmapp/viogpu-wddm/releases/download/v0.6/viogpu3d-arm64x-signed.zip
          echo "723131a1d0a8b7f01037b7efe3b6ac7b90f034734460885fba0edd7d8c75425f  $work/driver.zip" | sha256sum -c -
          python3 - "$work" <<'PY'
          import pathlib, sys, zipfile
          z=pathlib.Path(sys.argv[1])/"driver.zip"
          assert z.stat().st_size == 2784710
          with zipfile.ZipFile(z) as a:
              assert a.testzip() is None
              assert len([n for n in a.namelist() if n.rsplit("/",1)[-1].lower()=="viogpu3d.inf"]) == 1
          s=pathlib.Path("drivers/WindowsiOS-ez-MetalGPU-Driver.cmd").read_bytes()
          assert s.startswith(b"@echo off")
          assert b"powershell" not in s.lower()
          assert b"723131a1d0a8b7f01037b7efe3b6ac7b90f034734460885fba0edd7d8c75425f" in s
          assert b"pnputil.exe /add-driver" in s
          PY
      - name: Publish R2 installer
        run: |
          set -euo pipefail
          cd drivers
          sha256sum WindowsiOS-ez-MetalGPU-Driver.cmd > SHA256SUMS
          gh release create metalgpu-driver-v0.6-r2 WindowsiOS-ez-MetalGPU-Driver.cmd SHA256SUMS --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "MetalGPU Driver Installer v0.6 R2 (Windows ARM64)" --notes-file README.md --prerelease --latest=false
